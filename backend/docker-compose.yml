version: "3.8"

services:
 postgres:
 image: postgres:15-alpine
 container_name: brandlens-postgres
 restart: unless-stopped
 environment:
 POSTGRES_USER: brandlens
 POSTGRES_PASSWORD: brandlens_password
 POSTGRES_DB: brandlens
 ports:
 - "5432:5432"
 volumes:
 - postgres_data:/var/lib/postgresql/data
 - ./prisma/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
 healthcheck:
 test: ["CMD-SHELL", "pg_isready -U brandlens"]
 interval: 5s
 timeout: 5s
 retries: 5

 redis:
 image: redis:7-alpine
 container_name: brandlens-redis
 restart: unless-stopped
 command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
 ports:
 - "6379:6379"
 volumes:
 - redis_data:/data
 healthcheck:
 test: ["CMD", "redis-cli", "ping"]
 interval: 5s
 timeout: 3s
 retries: 5

 app:
 build:
 context: .
 dockerfile: Dockerfile
 container_name: brandlens-app
 restart: unless-stopped
 ports:
 - "3000:3000"
 environment:
 DATABASE_URL: postgresql://brandlens:brandlens_password@postgres:5432/brandlens
 REDIS_URL: redis://redis:6379
 NODE_ENV: production
 PORT: 3000
 depends_on:
 postgres:
 condition: service_healthy
 redis:
 condition: service_healthy
 healthcheck:
 test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) })"]
 interval: 30s
 timeout: 5s
 retries: 3
 start_period: 15s

 worker:
 build:
 context: .
 dockerfile: Dockerfile
 container_name: brandlens-worker
 restart: unless-stopped
 environment:
 DATABASE_URL: postgresql://brandlens:brandlens_password@postgres:5432/brandlens
 REDIS_URL: redis://redis:6379
 NODE_ENV: production
 command: node dist/queue/worker.js
 depends_on:
 postgres:
 condition: service_healthy
 redis:
 condition: service_healthy

 scheduler:
 build:
 context: .
 dockerfile: Dockerfile
 container_name: brandlens-scheduler
 restart: unless-stopped
 environment:
 DATABASE_URL: postgresql://brandlens:brandlens_password@postgres:5432/brandlens
 REDIS_URL: redis://redis:6379
 NODE_ENV: production
 command: node dist/jobs/scanner-scheduler.js
 depends_on:
 postgres:
 condition: service_healthy
 redis:
 condition: service_healthy

volumes:
 postgres_data:
 redis_data:
