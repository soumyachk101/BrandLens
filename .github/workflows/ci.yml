name: CI/CD Pipeline

on:
 push:
 branches: [main, develop]
 tags: ["v*"]
 pull_request:
 branches: [main, develop]

env:
 NODE_VERSION: "20"
 FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
 # Lint and type-check both frontend and backend
 lint-and-typecheck:
 name: Lint & Type Check
 runs-on: ubuntu-latest
 timeout-minutes: 15
 strategy:
 fail-fast: false
 matrix:
 project: [backend, frontend]

 steps:
 - name: Checkout code
 uses: actions/checkout@v4

 - name: Setup Node.js
 uses: actions/setup-node@v4
 with:
 node-version: ${{ env.NODE_VERSION }}
 cache: ${{ matrix.project }}

 - name: Install dependencies
 working-directory: ./${{ matrix.project }}
 run: npm ci --ignore-scripts

 - name: Run linter
 working-directory: ./${{ matrix.project }}
 run: |
 if [ -f package.json ] && grep -q '"lint"' package.json; then
 npm run lint
 else
 echo "No lint script defined, skipping..."
 fi

 - name: Run type-check
 working-directory: ./${{ matrix.project }}
 run: |
 if [ -f package.json ] && grep -q '"type-check"' package.json; then
 npm run type-check
 elif [ -f tsconfig.json ]; then
 npx tsc --noEmit
 else
 echo "No type-check defined, skipping..."
 fi

 # Run tests for backend
 test-backend:
 name: Backend Tests
 runs-on: ubuntu-latest
 timeout-minutes: 20
 services:
 postgres:
 image: postgres:15-alpine
 env:
 POSTGRES_USER: brandlens_test
 POSTGRES_PASSWORD: test_password
 POSTGRES_DB: brandlens_test
 ports:
 - 5432:5432
 options: >-
 --health-cmd pg_isready
 --health-interval 10s
 --health-timeout 5s
 --health-retries 5
 redis:
 image: redis:7-alpine
 ports:
 - 6379:6379
 options: >-
 --health-cmd "redis-cli ping"
 --health-interval 10s
 --health-timeout 5s
 --health-retries 5

 steps:
 - uses: actions/checkout@v4

 - name: Setup Node.js
 uses: actions/setup-node@v4
 with:
 node-version: ${{ env.NODE_VERSION }}
 cache: backend

 - name: Install dependencies
 working-directory: ./backend
 run: npm ci --ignore-scripts

 - name: Generate Prisma Client
 working-directory: ./backend
 run: npx prisma generate

 - name: Run database migrations
 working-directory: ./backend
 env:
 DATABASE_URL: postgresql://brandlens_test:test_password@localhost:5432/brandlens_test?schema=public
 run: npx prisma migrate deploy

 - name: Run tests
 working-directory: ./backend
 env:
 NODE_ENV: test
 DATABASE_URL: postgresql://brandlens_test:test_password@localhost:5432/brandlens_test?schema=public
 REDIS_URL: redis://localhost:6379
 JWT_SECRET: test-jwt-secret-for-ci-only
 run: |
 if [ -f package.json ] && grep -q '"test"' package.json; then
 npm test -- --coverage --maxWorkers=2
 else
 echo "No tests defined"
 fi

 - name: Upload coverage
 uses: codecov/codecov-action@v4
 if: always()
 with:
 directory: ./backend/coverage
 flags: backend

 # Run tests for frontend
 test-frontend:
 name: Frontend Tests
 runs-on: ubuntu-latest
 timeout-minutes: 20
 steps:
 - uses: actions/checkout@v4

 - name: Setup Node.js
 uses: actions/setup-node@v4
 with:
 node-version: ${{ env.NODE_VERSION }}
 cache: frontend

 - name: Install dependencies
 working-directory: ./frontend
 run: npm ci --ignore-scripts

 - name: Run tests
 working-directory: ./frontend
 env:
 NODE_ENV: test
 CI: true
 run: |
 if [ -f package.json ] && grep -q '"test"' package.json; then
 npm test -- --coverage --watchAll=false
 else
 echo "No tests defined"
 fi

 - name: Upload coverage
 uses: codecov/codecov-action@v4
 if: always()
 with:
 directory: ./frontend/coverage
 flags: frontend

 # Build Docker images
 build-backend:
 name: Build Backend Docker
 runs-on: ubuntu-latest
 needs: [lint-and-typecheck, test-backend]
 if: github.event_name == 'push'
 timeout-minutes: 20
 steps:
 - uses: actions/checkout@v4

 - name: Set up Docker Buildx
 uses: docker/setup-buildx-action@v3

 - name: Log in to GitHub Container Registry
 uses: docker/login-action@v3
 with:
 registry: ghcr.io
 username: ${{ github.actor }}
 password: ${{ secrets.GITHUB_TOKEN }}

 - name: Extract metadata
 id: meta
 uses: docker/metadata-action@v5
 with:
 images: ghcr.io/${{ github.repository }}/backend
 tags: |
 type=ref,event=branch
 type=ref,event=pr
 type=sha,prefix=sha-
 type=raw,value=latest,enable={{is_default_branch}}

 - name: Build and push
 uses: docker/build-push-action@v5
 with:
 context: ./backend
 file: ./Dockerfile.backend
 push: true
 tags: ${{ steps.meta.outputs.tags }}
 labels: ${{ steps.meta.outputs.labels }}
 cache-from: type=gha
 cache-to: type=gha,mode=max

 build-frontend:
 name: Build Frontend Docker
 runs-on: ubuntu-latest
 needs: [lint-and-typecheck, test-frontend]
 if: github.event_name == 'push'
 timeout-minutes: 20
 steps:
 - uses: actions/checkout@v4

 - name: Set up Docker Buildx
 uses: docker/setup-buildx-action@v3

 - name: Log in to GitHub Container Registry
 uses: docker/login-action@v3
 with:
 registry: ghcr.io
 username: ${{ github.actor }}
 password: ${{ secrets.GITHUB_TOKEN }}

 - name: Extract metadata
 id: meta
 uses: docker/metadata-action@v5
 with:
 images: ghcr.io/${{ github.repository }}/frontend
 tags: |
 type=ref,event=branch
 type=ref,event=pr
 type=sha,prefix=sha-
 type=raw,value=latest,enable={{is_default_branch}}

 - name: Build and push
 uses: docker/build-push-action@v5
 with:
 context: ./frontend
 file: ./Dockerfile.frontend
 push: true
 tags: ${{ steps.meta.outputs.tags }}
 labels: ${{ steps.meta.outputs.labels }}
 cache-from: type=gha
 cache-to: type=gha,mode=max

 # Deploy to staging on main branch
 deploy-staging:
 name: Deploy to Staging
 runs-on: ubuntu-latest
 needs: [build-backend, build-frontend]
 if: github.event_name == 'push' && github.ref == 'refs/heads/main'
 timeout-minutes: 20
 environment:
 name: staging
 url: https://brandlens-api-staging.fly.dev
 steps:
 - uses: actions/checkout@v4

 - name: Setup Fly.io CLI
 uses: superfly/flyctl-actions/setup-flyctl@master

 - name: Deploy Backend to Fly.io (Staging)
 env:
 FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
 app: brandlens-api-staging
 working_directory: ./backend
 commands: |
 flyctl deploy --config fly.toml -a brandlens-api-staging --strategy canary

 - name: Run Migrations
 env:
 FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
 working_directory: ./backend
 commands: |
 flyctl ssh console -C "npx prisma migrate deploy" -a brandlens-api-staging

 - name: Health Check
 env:
 FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
 working_directory: ./backend
 commands: |
 sleep 30
 flyctl status -a brandlens-api-staging
 flyctl checks list -a brandlens-api-staging

 - name: Deploy Frontend to Fly.io (Staging)
 env:
 FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
 app: brandlens-frontend-staging
 working_directory: ./frontend
 commands: |
 flyctl deploy --config fly.frontend.toml -a brandlens-frontend-staging --strategy canary

 # Deploy to production on version tags
 deploy-production:
 name: Deploy to Production
 runs-on: ubuntu-latest
 needs: [build-backend, build-frontend]
 if: startsWith(github.ref, 'refs/tags/v')
 timeout-minutes: 30
 environment:
 name: production
 url: https://brandlens-api.fly.dev
 steps:
 - uses: actions/checkout@v4

 - name: Setup Fly.io CLI
 uses: superfly/flyctl-actions/setup-flyctl@master

 - name: Deploy Backend to Fly.io (Production)
 env:
 FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
 working_directory: ./backend
 commands: |
 flyctl deploy --config fly.toml -a brandlens-api --strategy canary

 - name: Run Migrations
 env:
 FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
 working_directory: ./backend
 commands: |
 flyctl ssh console -C "npx prisma migrate deploy" -a brandlens-api

 - name: Health Check
 env:
 FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
 working_directory: ./backend
 commands: |
 sleep 30
 flyctl status -a brandlens-api
 flyctl checks list -a brandlens-api

 - name: Create Release
 env:
 GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
 run: |
 gh release create "$GITHUB_REF_NAME" \
 --title "Release $GITHUB_REF_NAME" \
 --notes "Production deployment of BrandLens API" \
 || true

 # Security scanning
 security-scan:
 name: Security Scan
 runs-on: ubuntu-latest
 timeout-minutes: 15
 steps:
 - uses: actions/checkout@v4

 - name: Run Trivy vulnerability scanner
 uses: aquasecurity/trivy-action@master
 with:
 scan-type: 'fs'
 scan-ref: '.'
 format: 'sarif'
 output: 'trivy-results.sarif'

 - name: Upload Trivy scan results to GitHub Security tab
 uses: github/codeql-action/upload-sarif@v3
 if: always()
 with:
 sarif_file: 'trivy-results.sarif'

 # Notify on failures
 notify-failure:
 name: Notify on Failure
 runs-on: ubuntu-latest
 needs: [lint-and-typecheck, test-backend, test-frontend]
 if: failure()
 steps:
 - name: Send Slack notification
 uses: slackapi/slack-github-action@v1.27.0
 with:
 payload: |
 {
 "text": ":x: BrandLens CI failed on ${{ github.ref }}\nCommit: ${{ github.sha }}\nAuthor: ${{ github.actor }}\nWorkflow: ${{ github.workflow }}\nRun: ${{ github.run_id }}"
 env:
 SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
 if: env.SLACK_WEBHOOK != ''
