version: "3.8"

services:
 # PostgreSQL Database
 postgres:
 image: postgres:15-alpine
 container_name: brandlens-postgres
 restart: unless-stopped
 environment:
 POSTGRES_USER: brandlens
 POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
 POSTGRES_DB: brandlens
 ports:
 - "127.0.0.1:5432:5432"
 volumes:
 - postgres_data:/var/lib/postgresql/data
 healthcheck:
 test: ["CMD-SHELL", "pg_isready -U brandlens -d brandlens"]
 interval: 10s
 timeout: 5s
 retries: 5
 start_period: 10s
 networks:
 - brandlens-network
 labels:
 - "traefik.enable=false"

 # Redis Cache & Session Store
 redis:
 image: redis:7-alpine
 container_name: brandlens-redis
 restart: unless-stopped
 command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
 ports:
 - "127.0.0.1:6379:6379"
 volumes:
 - redis_data:/data
 healthcheck:
 test: ["CMD", "redis-cli", "ping"]
 interval: 10s
 timeout: 5s
 retries: 3
 start_period: 5s
 networks:
 - brandlens-network
 labels:
 - "traefik.enable=false"

 # BrandLens Backend API
 brandlens-api:
 build:
 context: .
 dockerfile: Dockerfile.backend
 target: runner
 container_name: brandlens-api
 restart: unless-stopped
 depends_on:
 postgres:
 condition: service_healthy
 redis:
 condition: service_healthy
 ports:
 - "127.0.0.1:3001:3001"
 environment:
 NODE_ENV: production
 PORT: 3001
 DATABASE_URL: postgresql://brandlens:${POSTGRES_PASSWORD:-changeme_in_production}@postgres:5432/brandlens?schema=public
 REDIS_URL: redis://redis:6379
 OPENAI_API_KEY: ${OPENAI_API_KEY}
 ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
 GOOGLE_API_KEY: ${GOOGLE_API_KEY}
 RESEND_API_KEY: ${RESEND_API_KEY}
 SENTRY_DSN: ${SENTRY_DSN}
 JWT_SECRET: ${JWT_SECRET}
 # Optional configuration
 LOG_LEVEL: ${LOG_LEVEL:-info}
 CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
 RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
 volumes:
 - ./logs:/app/logs
 healthcheck:
 test: ["CMD-SHELL", "node -e \"const http=require('http');const req=http.request({hostname:'localhost',port:3001,path:'/health',method:'GET',timeout:5000},(res)=>{process.exit(res.statusCode===200?0:1)});req.on('error',()=>process.exit(1));req.end()\""]
 interval: 30s
 timeout: 5s
 retries: 3
 start_period: 15s
 networks:
 - brandlens-network
 deploy:
 resources:
 limits:
 memory: 256M
 reservations:
 memory: 128M
 logging:
 driver: "json-file"
 options:
 max-size: "10m"
 max-file: "3"

 # BrandLens Frontend (Next.js)
 brandlens-frontend:
 build:
 context: .
 dockerfile: Dockerfile.frontend
 target: runner
 container_name: brandlens-frontend
 restart: unless-stopped
 ports:
 - "127.0.0.1:3000:80"
 environment:
 NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
 NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
 depends_on:
 brandlens-api:
 condition: service_healthy
 networks:
 - brandlens-network
 deploy:
 resources:
 limits:
 memory: 128M
 reservations:
 memory: 64M
 logging:
 driver: "json-file"
 options:
 max-size: "10m"
 max-file: "3"

 # Nginx Reverse Proxy
 nginx:
 image: nginx:1.27-alpine
 container_name: brandlens-nginx
 restart: unless-stopped
 ports:
 - "80:80"
 - "443:443"
 volumes:
 - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
 - ./ssl:/etc/nginx/ssl:ro
 depends_on:
 brandlens-api:
 condition: service_healthy
 brandlens-frontend:
 condition: service_started
 networks:
 - brandlens-network
 deploy:
 resources:
 limits:
 memory: 64M
 reservations:
 memory: 32M
 logging:
 driver: "json-file"
 options:
 max-size: "10m"
 max-file: "3"

volumes:
 postgres_data:
 driver: local
 redis_data:
 driver: local

networks:
 brandlens-network:
 driver: bridge
 name: brandlens-network
