server {
 listen 80;
 server_name _;
 root /app;
 index index.html;

 # Security headers
 add_header X-Frame-Options "SAMEORIGIN" always;
 add_header X-Content-Type-Options "nosniff" always;
 add_header X-XSS-Protection "1; mode=block" always;
 add_header Referrer-Policy "strict-origin-when-cross-origin" always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' http://localhost:3001 ws://localhost:3001;" always;

 # Gzip compression
 gzip on;
 gzip_vary on;
 gzip_min_length 1024;
 gzip_comp_level 6;
 gzip_types
 text/plain
 text/css
 text/xml
 text/javascript
 application/json
 application/javascript
 application/xml+rss
 application/atom+xml
 image/svg+xml
 font/woff
 font/woff2;

 # Serve Next.js static assets
 location /_next/static/ {
 expires 365d;
 add_header Cache-Control "public, immutable";
 access_log off;
 }

 # Serve public assets
 location /_next/ {
 expires 1d;
 add_header Cache-Control "public";
 }

 location /public/ {
 expires 30d;
 add_header Cache-Control "public";
 }

 # Proxy API requests to backend
 location /api/ {
 proxy_pass http://localhost:3001;
 proxy_http_version 1.1;
 proxy_set_header Upgrade $http_upgrade;
 proxy_set_header Connection 'upgrade';
 proxy_set_header Host $host;
 proxy_set_header X-Real-IP $remote_addr;
 proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 proxy_set_header X-Forwarded-Proto $scheme;
 proxy_cache_bypass $http_upgrade;
 proxy_connect_timeout 60s;
 proxy_send_timeout 60s;
 proxy_read_timeout 60s;
 }

 # Proxy WebSocket connections
 location /socket.io/ {
 proxy_pass http://localhost:3001;
 proxy_http_version 1.1;
 proxy_set_header Upgrade $http_upgrade;
 proxy_set_header Connection "Upgrade";
 proxy_set_header Host $host;
 proxy_set_header X-Real-IP $remote_addr;
 proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 proxy_set_header X-Forwarded-Proto $scheme;
 }

 # Next.js page routes - serve from static export or proxy to Node
 location / {
 try_files $uri $uri.html $uri/ /index.html;
 expires 1h;
 add_header Cache-Control "public, must-revalidate";
 }

 # Health check endpoint
 location = /health {
 access_log off;
 return 200 "healthy\n";
 add_header Content-Type text/plain;
 }
}
